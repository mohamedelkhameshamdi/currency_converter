<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08111f">
  <title>Neon Pong</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: rgba(15, 29, 49, 0.88);
      --line: #244568;
      --text: #e8f4ff;
      --muted: #8ca9c4;
      --cyan: #62e6ff;
      --pink: #ff6eb4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(98, 230, 255, 0.11), transparent 28%),
        radial-gradient(circle at 84% 88%, rgba(255, 110, 180, 0.1), transparent 30%),
        var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .game-shell {
      width: min(94vw, 940px);
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid rgba(98, 230, 255, 0.18);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35), 0 0 80px rgba(98, 230, 255, 0.05);
      backdrop-filter: blur(14px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--cyan);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.45rem); letter-spacing: -0.04em; }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }

    .score { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; line-height: 1; }
    .score.player { color: var(--cyan); }
    .score.cpu { color: var(--pink); }
    .divider { color: var(--muted); font-size: 1.4rem; }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #07101d;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.38);
    }

    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
    }

    .message span {
      padding: 10px 18px;
      border: 1px solid rgba(98, 230, 255, 0.25);
      border-radius: 999px;
      background: rgba(7, 16, 29, 0.8);
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 0 30px rgba(98, 230, 255, 0.12);
    }

    .message.hidden { display: none; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    button {
      border: 1px solid rgba(98, 230, 255, 0.35);
      border-radius: 999px;
      padding: 9px 16px;
      background: rgba(98, 230, 255, 0.1);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover { background: rgba(98, 230, 255, 0.2); transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    @media (max-width: 560px) {
      header, footer { align-items: flex-start; flex-direction: column; }
      .scoreboard { align-self: flex-end; }
      footer { gap: 10px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Arcade classic</p>
        <h1>Neon Pong</h1>
      </div>
      <div class="scoreboard" aria-label="Score">
        <span class="score player" id="playerScore">0</span>
        <span class="divider">:</span>
        <span class="score cpu" id="cpuScore">0</span>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="game" aria-label="Pong game"></canvas>
      <div class="message" id="message"><span>Press Space or tap to start</span></div>
    </div>

    <footer>
      <span>Move with <strong>W</strong> / <strong>S</strong> or ↑ / ↓</span>
      <button id="restart" type="button">Restart game</button>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const playerScore = document.getElementById("playerScore");
    const cpuScore = document.getElementById("cpuScore");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    const keys = new Set();
    const state = {
      running: false,
      player: 0,
      cpu: 0,
      paddleWidth: 12,
      paddleHeight: 92,
      playerY: 0,
      cpuY: 0,
      ballX: 0,
      ballY: 0,
      ballSize: 10,
      velocityX: 0,
      velocityY: 0,
      lastFrame: 0
    };

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const bounds = canvas.getBoundingClientRect();
      canvas.width = Math.round(bounds.width * ratio);
      canvas.height = Math.round(bounds.height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      if (!state.running) resetRound();
    }

    function width() { return canvas.clientWidth; }
    function height() { return canvas.clientHeight; }

    function resetRound(direction = Math.random() > 0.5 ? 1 : -1) {
      state.playerY = height() / 2 - state.paddleHeight / 2;
      state.cpuY = state.playerY;
      state.ballX = width() / 2;
      state.ballY = height() / 2;
      const angle = (Math.random() * 0.8 - 0.4);
      state.velocityX = direction * Math.max(260, width() * 0.55);
      state.velocityY = Math.sin(angle) * Math.max(180, height() * 0.6);
    }

    function start() {
      if (!state.running) {
        state.running = true;
        message.classList.add("hidden");
        state.lastFrame = performance.now();
        requestAnimationFrame(loop);
      }
    }

    function restart() {
      state.player = 0;
      state.cpu = 0;
      playerScore.textContent = "0";
      cpuScore.textContent = "0";
      state.running = false;
      resetRound();
      message.innerHTML = "<span>Press Space or tap to start</span>";
      message.classList.remove("hidden");
    }

    function scorePoint(winner) {
      state[winner] += 1;
      playerScore.textContent = state.player;
      cpuScore.textContent = state.cpu;
      state.running = false;
      resetRound(winner === "player" ? 1 : -1);
      message.innerHTML = `<span>${winner === "player" ? "Point for you!" : "CPU scores!"} Press Space to continue</span>`;
      message.classList.remove("hidden");
    }

    function update(delta) {
      const speed = 440;
      if (keys.has("w") || keys.has("arrowup")) state.playerY -= speed * delta;
      if (keys.has("s") || keys.has("arrowdown")) state.playerY += speed * delta;
      state.playerY = Math.max(0, Math.min(height() - state.paddleHeight, state.playerY));

      const target = state.ballY - state.paddleHeight / 2;
      state.cpuY += (target - state.cpuY) * Math.min(1, delta * 4.5);
      state.cpuY = Math.max(0, Math.min(height() - state.paddleHeight, state.cpuY));

      state.ballX += state.velocityX * delta;
      state.ballY += state.velocityY * delta;
      if (state.ballY - state.ballSize / 2 <= 0 || state.ballY + state.ballSize / 2 >= height()) {
        state.velocityY *= -1;
        state.ballY = Math.max(state.ballSize / 2, Math.min(height() - state.ballSize / 2, state.ballY));
      }

      const playerHit = state.ballX - state.ballSize / 2 <= 26 + state.paddleWidth &&
        state.ballX > 26 &&
        state.ballY >= state.playerY &&
        state.ballY <= state.playerY + state.paddleHeight;
      const cpuHit = state.ballX + state.ballSize / 2 >= width() - 26 - state.paddleWidth &&
        state.ballX < width() - 26 &&
        state.ballY >= state.cpuY &&
        state.ballY <= state.cpuY + state.paddleHeight;

      if (playerHit && state.velocityX < 0) {
        state.velocityX = Math.min(Math.abs(state.velocityX) * 1.05, 720);
        state.velocityY += (state.ballY - (state.playerY + state.paddleHeight / 2)) * 4;
      }
      if (cpuHit && state.velocityX > 0) {
        state.velocityX = -Math.min(Math.abs(state.velocityX) * 1.05, 720);
        state.velocityY += (state.ballY - (state.cpuY + state.paddleHeight / 2)) * 4;
      }
      if (state.ballX < -20) scorePoint("cpu");
      if (state.ballX > width() + 20) scorePoint("player");
    }

    function draw() {
      const w = width();
      const h = height();
      context.clearRect(0, 0, w, h);
      context.fillStyle = "#07101d";
      context.fillRect(0, 0, w, h);

      context.setLineDash([8, 14]);
      context.strokeStyle = "rgba(140, 169, 196, 0.23)";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(w / 2, 0);
      context.lineTo(w / 2, h);
      context.stroke();
      context.setLineDash([]);

      context.shadowBlur = 18;
      context.shadowColor = "#62e6ff";
      context.fillStyle = "#62e6ff";
      context.fillRect(26, state.playerY, state.paddleWidth, state.paddleHeight);
      context.shadowColor = "#ff6eb4";
      context.fillStyle = "#ff6eb4";
      context.fillRect(w - 26 - state.paddleWidth, state.cpuY, state.paddleWidth, state.paddleHeight);
      context.shadowColor = "#ffffff";
      context.fillStyle = "#ffffff";
      context.beginPath();
      context.arc(state.ballX, state.ballY, state.ballSize / 2, 0, Math.PI * 2);
      context.fill();
      context.shadowBlur = 0;
    }

    function loop(timestamp) {
      if (!state.running) return;
      const delta = Math.min((timestamp - state.lastFrame) / 1000, 0.03);
      state.lastFrame = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["w", "s", "arrowup", "arrowdown", " "].includes(key)) event.preventDefault();
      keys.add(key);
      if (key === " ") start();
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
    canvas.addEventListener("pointerdown", start);
    restartButton.addEventListener("click", restart);

    resizeCanvas();
    draw();
  </script>
</body>
</html>
